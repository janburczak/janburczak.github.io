<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == '/' %}{{ site.title }} — Mathematician, Leipzig University{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="sitename" href="{{ '/' | relative_url }}">{{ site.title }}<span>{{ site.tagline }}</span></a>
    <nav>
      <ul>
        {%- for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  {%- if page.url != '/' %}
  <h1 class="page-title">{{ page.title }}</h1>
  {%- endif %}
  {{ content }}
</main>

<footer>
  <div class="wrap">
    {{ site.title }} · Faculty of Mathematics, Leipzig University ·
    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  </div>
</footer>

</body>
</html>
